.extension{margin-bottom:26px}.answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}textarea{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:14px;border-radius:12px;width:100%;resize:vertical}button:disabled{opacity:.45;cursor:not-allowed}.settings.card{max-width:850px;margin-top:24px}h1{font-weight:600}.hero{background:radial-gradient(ellipse at top right,#52785a 0%,#264b3e 65%);border-radius:24px;min-height:235px}.card{border-radius:20px}.brand{letter-spacing:-1px}nav button{border-radius:12px}body{background-image:radial-gradient(ellipse at top right,#98ae7210,transparent 60%)}@media print{aside,.topbar,.toolbar,.actions,button,.footer,dialog,#toast{display:none!important}.shell{display:block}main{padding:0}.card,.hero{break-inside:avoid;box-shadow:none}.hero{background:white;color:black}.hero .muted,.hero .eyebrow{color:#333}body.dark{--bg:#fff;--panel:#fff;--ink:#000;--muted:#333;--line:#ccc;--green:#264b3e}body{background:#fff}.cards{display:block}.tablewrap{overflow:visible}table{white-space:normal}}
